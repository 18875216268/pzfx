<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同环比分析工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <link rel="stylesheet" href="gonggong/gonggong.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tongzhi/tongzhi.css">
</head>
<body>
    <!-- 主布局 -->
    <div class="主布局">
        <!-- 基础配置 -->
        <div class="基础配置">
            <div class="card-item">
                <div class="card-header">
                    <label>1.请选择文件：</label>
                </div>
                <div class="flex-container">
                    <input type="text" id="folderPath" class="input input-readonly flex-1" placeholder="请选择Excel文件" readonly>
                    <button id="selectFolderBtn" class="btn btn-primary">选择</button>
                    <input type="file" id="folderInput" multiple accept=".xlsx,.xls" style="display: none;">
                </div>
            </div>
            
            <div class="card-item">
                <div class="card-header">
                    <label>2.请选择标题行：</label>
                </div>
                <select id="headerRowSelect">
                    <option value="">无</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            
            <div class="card-item fields-list-container">
                <div class="card-header">
                    <label>可用字段列表：</label>
                </div>
                <div id="fieldsListArea" class="field-container">
                    <div class="placeholder">请先选择文件和标题行</div>
                </div>
            </div>
        </div>
        
        <!-- 透视设置 -->
        <div class="透视设置">
            <!-- 配置区域 -->
            <div class="配置区域">
                <!-- 1.分组字段 -->
                <div class="配置项">
                    <div class="config-header">
                        <label>1.请添加分组字段：</label>
                    </div>
                    <div id="groupFieldsInput" class="field-container" data-type="group"></div>
                </div>
                
                <!-- 2.聚合字段 -->
                <div class="配置项">
                    <div class="config-header">
                        <label>2.请添加聚合字段：</label>
                    </div>
                    <div id="aggregateFieldsInput" class="field-container" data-type="aggregate"></div>
                </div>
                
                <!-- 3.基础信息 -->
                <div class="配置项">
                    <div class="config-header">
                        <label>3.请选择基础信息：</label>
                    </div>
                    <div id="basicInfoFieldsInput" class="field-container" data-type="basicInfo"></div>
                </div>
                
                <!-- 4.创建计算字段 -->
                <div class="配置项 calc-field-section">
                    <div class="config-header">
                        <label>4.请创建计算字段：</label>
                        <button id="addCalcFieldBtn" class="add-field-btn" title="添加计算字段">+</button>
                    </div>
                    <div id="calcFieldsList" class="field-container" data-type="calc"></div>
                </div>
            </div>
            
            <!-- 分组处理按钮 -->
            <div class="分组处理按钮">
                <button id="processBtn" class="btn btn-primary btn-large" disabled>开始处理</button>
            </div>
        </div>
    </div>

    <!-- 下载按钮 -->
    <button id="downloadBtn" class="download-icon-btn" disabled>
        <svg class="download-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        <span class="loading-spinner" style="display: none;"></span>
    </button>
    
    <div class="notification-container"></div>
    
    <!-- 错误提示 -->
    <div id="errorSection" class="error-container" style="display: none;">
        <p id="errorMessage" class="error-message"></p>
    </div>

    <script src="gonggong/gonggong.js"></script>
    <script src="tongzhi/tongzhi.js"></script>
    <script src="huizong/fenzu.js"></script>
    <script src="huizong/jisuan.js"></script>
    <script src="huizong/juhe.js"></script>
    <script src="huizong/tianchong.js"></script>
    <script src="script.js"></script>
</body>
</html>
