<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品种数据汇总分析</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
    <link rel="stylesheet" href="gonggong/gonggong.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tongzhi/tongzhi.css">
    <link rel="stylesheet" href="huizong/chuangjian/chuangjian.css">
</head>
<body>
    <!-- 主布局 -->
    <div class="主布局">
        <!-- 基础配置 -->
        <div class="基础配置">
            <div class="card-item">
                <div class="card-header">
                    <label>1.请选择文件：</label>
                </div>
                <div class="flex-container">
                    <input type="text" id="folderPath" class="input input-readonly flex-1" placeholder="请选择Excel文件" readonly>
                    <button id="selectFolderBtn" class="btn btn-primary">选择</button>
                    <input type="file" id="folderInput" multiple accept=".xlsx,.xls" style="display: none;">
                </div>
            </div>
            
            <div class="card-item">
                <div class="card-header">
                    <label>2.请选择标题行：</label>
                </div>
                <select id="headerRowSelect">
                    <option value="">无</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </div>
            
            <div class="card-item">
                <div class="card-header">
                    <label>可用字段列表：</label>
                </div>
                <div id="fieldsListArea" class="field-container">
                    <div class="placeholder">请先选择文件和标题行</div>
                </div>
            </div>
        </div>
        
        <!-- 透视设置 -->
        <div class="透视设置">
            <!-- 配置区域 -->
            <div class="配置区域">
                <!-- 1.分组字段 -->
                <div class="配置项">
                    <div class="config-header">
                        <label>1.请添加分组字段：</label>
                    </div>
                    <div id="groupFieldsInput" class="field-container" data-type="group"></div>
                </div>
                
                <!-- 2.聚合字段 -->
                <div class="配置项">
                    <div class="config-header">
                        <label>2.请添加聚合字段：</label>
                    </div>
                    <div id="aggregateFieldsInput" class="field-container" data-type="aggregate"></div>
                </div>
                
                <!-- 3.计算字段 -->
                <div class="配置项">
                    <div class="config-header">
                        <label>请创建计算字段：</label>
                        <button id="addCalcFieldBtn" class="add-calc-btn">+</button>
                    </div>
                    <div id="calcFieldsInput" class="field-container" data-type="calculated"></div>
                </div>
                
                <!-- 4.预留功能 -->
                <div class="配置项">
                    <button class="placeholder-add-btn">+</button>
                </div>
            </div>
            
            <!-- 分组处理按钮 -->
            <div class="分组处理按钮">
                <button id="processBtn" class="btn btn-primary btn-large" disabled>开始处理</button>
            </div>
        </div>
    </div>

    <!-- 下载按钮 -->
    <button id="downloadBtn" class="download-icon-btn" disabled>
        <svg class="download-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
        </svg>
        <span class="loading-spinner" style="display: none;"></span>
    </button>
    
    <div class="notification-container"></div>
    
    <!-- 错误提示 -->
    <div id="errorSection" class="error-container" style="display: none;">
        <p id="errorMessage" class="error-message"></p>
    </div>

    <!-- 计算字段弹窗 -->
    <div id="calcFieldModal" class="calc-field-modal" style="display: none;">
        <div class="calc-field-modal-content">
            <div class="calc-field-modal-header">
                <h3>创建计算字段</h3>
                <button class="calc-field-modal-close">&times;</button>
            </div>
            <div class="calc-field-modal-body">
                <!-- 候选标签区域 -->
                <div class="calc-field-candidate-area">
                    <!-- 字段列表区域 -->
                    <div class="calc-field-list-section">
                        <div class="calc-field-section-header">字段列表</div>
                        <div id="calcModalFieldsList" class="field-container"></div>
                    </div>
                    <!-- 已创建字段区域 -->
                    <div class="calc-field-created-section">
                        <div class="calc-field-section-header">已创建字段</div>
                        <div id="calcModalCreatedFields" class="field-container"></div>
                    </div>
                </div>
                <!-- 创建字段区域 -->
                <div class="calc-field-input-area">
                    <div id="calcFieldInput" class="calc-field-input" contenteditable="true" placeholder="字段名=表达式（按Enter换行，支持多个）"></div>
                </div>
            </div>
            <div class="calc-field-modal-footer">
                <button id="calcFieldCancelBtn" class="btn">取消</button>
                <button id="calcFieldAddBtn" class="btn btn-primary">添加</button>
                <button id="calcFieldConfirmBtn" class="btn btn-primary">确认</button>
            </div>
        </div>
    </div>

    <script src="gonggong/gonggong.js"></script>
    <script src="tongzhi/tongzhi.js"></script>
    <script src="huizong/fenzu.js"></script>
    <script src="huizong/juhe.js"></script>
    <script src="huizong/tianchong.js"></script>
    <script src="huizong/chuangjian/jisuan.js"></script>
    <script src="huizong/chuangjian.js"></script>
    <script src="script.js"></script>
</body>
</html>
